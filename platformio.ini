; G4MEOVER Heltec WiFi LoRa 32 V4 — Flipper-Hub
; ESP32-S3R2 + SX1262 + OLED (SD1315/SSD1306). Vom Flipper per GPIO-UART gesteuert,
; funkt per ESP-NOW an die Satelliten. GPS (GNSS-Stecker) ready, LoRa-Terminal folgt.
; Pins kompatibel zu V3. Generisches S3-Target (V4-Boarddef fehlt in PIO 6.5.0).
[env:heltec_v4_hub]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    olikraus/U8g2@^2.35.19
    mikalhart/TinyGPSPlus@^1.0.3
    jgromes/RadioLib@^6.6.0
    h2zero/NimBLE-Arduino@^1.4.1   ; BLE-Spam/Scan (V4-Executor)
build_flags =
    -D HELTEC_V4_HUB
    -D ESPNOW_CHANNEL=1
    ; Native USB als HARDWARE-CDC (nicht TinyUSB) -> zuverlaessige Debug-Serial am S3
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    ; Flipper-UART (Serial1)
    -D FLIPPER_RX=47
    -D FLIPPER_TX=48
    -D FLIPPER_BAUD=115200
board_build.flash_size = 16MB
